name: CI

# Builds and checks the site and the Pulumi program on every pull request and on pushes
# to main. A successful run on main triggers the Deploy workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: node --test scripts/check-versions.test.mjs

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/pulumi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: infra/pulumi/package.json
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Lint the bootstrap script
        working-directory: .
        run: shellcheck infra/bootstrap/bootstrap.sh
