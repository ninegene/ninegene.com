name: ninegene-com
description: Hosting for ninegene.com (private S3 + CloudFront + Route 53, Fastmail mail records)
runtime:
  name: nodejs
  options:
    packagemanager: npm
# State lives in a private S3 bucket in the personal AWS account, created by
# ../bootstrap/bootstrap.sh. Secrets use the KMS key it creates (see ../README.md).
backend:
  url: s3://ninegene-pulumi-state?region=us-east-2
